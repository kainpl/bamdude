services:
  bamdude:
    image: ghcr.io/kainpl/bamdude:latest
    build: .
    # Usage:
    #   docker compose up -d          → pulls pre-built image from ghcr.io
    #   docker compose up -d --build  → builds locally from source
    container_name: bamdude
    # File ownership inside the data and logs volumes is normalised by the
    # entrypoint at startup (chowns to PUID:PGID and drops privileges via
    # gosu before running the app). Override PUID / PGID below to match
    # your host user if needed — defaults to 1000:1000 to match the
    # historical compose `user:` directive.
    #
    # Allow binding to privileged ports (322, 990) as non-root user — required
    # for FTPS in every VP mode and for the RTSPS camera proxy in proxy mode +
    # non-proxy modes that have a target printer configured. Without this, the
    # FTP and RTSP listeners silently fail.
    cap_add:
      - NET_BIND_SERVICE
    #
    # LINUX: Use host mode for printer discovery and camera streaming
    network_mode: host
    #
    # macOS/WINDOWS: Docker Desktop doesn't support host mode.
    # Comment out "network_mode: host" above and uncomment "ports:" below.
    # Note: Printer discovery won't work - add printers manually by IP.
    #ports:
    #  - "${PORT:-8000}:8000"
    #  - "3000:3000"                  # Virtual printer bind/detect
    #  - "3002:3002"                  # Virtual printer bind/detect
    #  - "8883:8883"                  # Virtual printer MQTT
    #  - "990:990"                    # Virtual printer FTP control
    #  - "6000:6000"                  # Virtual printer file transfer tunnel
    #  - "322:322"                    # Virtual printer RTSP camera (X1/H2/P2; proxy mode + non-proxy modes with a target printer)
    #  - "2024-2026:2024-2026"        # Virtual printer proprietary ports (A1/P1S)
    #  - "50000-50029:50000-50029"    # Virtual printer FTP passive data (3 VPs × 10-port slice)
    # FTP passive-mode port slicing (#1646): non-proxy VPs get a 10-port slice
    # each, by VP id — VP 1 -> 50000-50009, VP 2 -> 50010-50019, and so on. The
    # range above covers 3 VPs; widen to "50000-500N9" where N = vp_count - 1.
    # Proxy-mode VPs forward the real printer's full range — expose
    # "50000-50100:50000-50100" instead if you use proxy mode. Narrowing this
    # matters under Docker's default userland-proxy: each exposed port spawns a
    # host proxy process per address family, so the old 1001-port range spawned
    # ~2000 processes (~3.5 GB host RAM); 30 ports -> ~60 processes (~210 MB).
    # This host RAM is host-level, not container-level, so it never shows up in
    # `docker stats` (#1646). Second, orthogonal escape hatch if you must run a
    # wide passive range in bridge mode: set { "userland-proxy": false } in
    # /etc/docker/daemon.json and restart Docker — the kernel then NATs directly
    # via iptables/nftables with no per-port host process. Only side effect is
    # that connections originating from 127.0.0.1 on the host itself can't reach
    # the container, which is fine for nearly every BamDude install.
    volumes:
      - bamdude_data:/app/data
      - bamdude_logs:/app/logs
      #
      # OPTIONAL — only needed if you ALSO run a native install of BamDude
      # on the same host and want both installs to share the same Virtual
      # Printer CA certificate (so the slicer only has to trust one CA).
      # Most Docker-only users should leave this commented out — the
      # entrypoint will keep the VP data inside the named volume above.
      # If uncommented, the entrypoint chowns the host directory to
      # PUID:PGID on first start so the container user can write to it.
      #- ./virtual_printer:/app/data/virtual_printer
      #
      # Tailscale integration (optional): mount the host's tailscaled socket so
      # the Virtual Printer card can show your tailnet IP and MagicDNS name to
      # paste into the slicer. The Tailscale CLI ships in the image, but it can
      # only talk to the daemon through this socket. Requires:
      #   1. Tailscale installed + `tailscale up` completed on the host
      #   2. `sudo tailscale set --operator=<container-user>` on the host so the
      #      user running the container may call `tailscale status`
      # Without this mount nothing breaks — the VP card simply shows Tailscale
      # as unavailable, and reaching a VP over LAN is unaffected.
      #- /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      #
      # Using a self-signed certificate (e.g. for a local Home Assistant
      # instance reachable over HTTPS). Drop your .crt files into the host
      # directory you mount here; the entrypoint installs them into the
      # system trust store on container startup. Enable trust-store loading
      # with USE_SYSTEM_TRUST_STORE=true in the environment block below.
      #- /path/to/certs:/usr/local/share/ca-certificates
    environment:
      - TZ=${TZ:-Europe/Kyiv}
      # User/group the container drops to after the entrypoint normalises
      # ownership on /app/data and /app/logs. Match your host user (run
      # `id -u` / `id -g`) if you want files written by the container to
      # show up as your user on the host. Defaults to 1000:1000.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Port BamDude runs on (default: 8000)
      # Usage: PORT=8080 docker compose up -d
      - PORT=${PORT:-8000}
      # Directory this compose file lives in, so Settings -> Updates can print
      # an update command you can paste from anywhere instead of one that only
      # works if you are already in the right directory. Uncomment to have
      # Compose fill it in from the shell you run `docker compose` in; the field
      # is also editable in Settings if you would rather set it there, or if you
      # drive Compose with `-f` from elsewhere.
      #- BAMDUDE_COMPOSE_DIR=${PWD}
      # PostgreSQL: uncomment to use external PostgreSQL instead of SQLite
      # Requires: PostgreSQL 14+ with the target database already created
      #- DATABASE_URL=postgresql+asyncpg://bamdude:password@postgres:5432/bamdude
      # Virtual printer: Set to the Docker host's IP when using bridge mode (ports:).
      # Required for FTP passive mode to work behind NAT.
      # Example: VIRTUAL_PRINTER_PASV_ADDRESS=192.168.1.100
      #- VIRTUAL_PRINTER_PASV_ADDRESS=
      # MFA at-rest encryption key (TOTP seeds, OIDC client_secrets).
      # Default-on: when unset, BamDude auto-generates a key on first startup
      # and writes /app/data/.mfa_encryption_key (mode 0600). The file is
      # bundled into backup ZIPs so backup→restore on a new host preserves
      # access to encrypted secrets. Pin explicitly here for multi-host /
      # multi-worker deployments where the key file is not shared.
      #- MFA_ENCRYPTION_KEY=
      #
      # Self-signed certificate trust — set any non-empty value to make the
      # entrypoint install certificates mounted under
      # /usr/local/share/ca-certificates into the container's system trust
      # store. See the volumes block above for the mount example. Typical
      # use case: a local Home Assistant instance with a self-signed cert
      # that BamDude needs to talk to over HTTPS.
      #- USE_SYSTEM_TRUST_STORE=true
    restart: unless-stopped

volumes:
  bamdude_data:
  bamdude_logs:
