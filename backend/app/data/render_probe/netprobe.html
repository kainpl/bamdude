<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>BamDude netprobe</title></head>
  <body>
    <script>
      function viaFetch(url) {
        const abort = new AbortController();
        const timer = setTimeout(() => abort.abort(), 3000);
        return fetch(url, { mode: 'no-cors', cache: 'no-store', signal: abort.signal })
          .then(() => 'fetched', (error) => (error && error.name) || String(error))
          .finally(() => clearTimeout(timer));
      }
      function viaSocket(url) {
        return new Promise((resolve) => {
          const socket = new WebSocket(url);
          const timer = setTimeout(() => { socket.close(); resolve('timeout'); }, 3000);
          socket.onopen = () => { clearTimeout(timer); socket.close(); resolve('open'); };
          socket.onerror = () => { clearTimeout(timer); resolve('error'); };
        });
      }
      (async () => {
        const targets = await (await fetch('targets.json')).json();
        const results = [];
        for (const target of targets) {
          const outcome = target.kind === 'websocket' ? await viaSocket(target.url) : await viaFetch(target.url);
          results.push({ name: target.name, outcome });
        }
        await fetch('result', { method: 'POST', body: JSON.stringify(results) });
      })();
    </script>
  </body>
</html>
