[project]
name = "bamdude"
version = "0.5.5"
description = "Self-hosted print archive, management and automation system for Bambu Lab 3D printers"
# 3.12 is the floor because it is what the distributions we target ship by
# default: Ubuntu 24.04 LTS gives 3.12, Debian 13 (trixie) gives 3.13. Pinning
# the floor to the oldest interpreter a user can realistically be handed keeps
# one runtime across the venv, CI, the Docker image and a bare-metal install —
# see docs on the one-runtime invariant. Raise it only when the oldest
# supported distribution moves.
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "static",
    "frontend",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",   # raise from (too noisy)
    "ARG001", # unused function argument (common in FastAPI)
    "ARG002", # unused method argument
    "SIM108", # ternary operator (readability preference)
    "SIM102", # nested if (readability preference)
    "SIM105", # contextlib.suppress (readability preference)
    # datetime.UTC alias. Available on every interpreter we now support — kept
    # ignored as a style choice, since rewriting 400+ `timezone.utc` call sites
    # would be pure churn. Drop the ignore if we ever touch them anyway.
    "UP017",
    # The three below became reachable when target-version moved to py312.
    # `class Foo(str, Enum)` -> `StrEnum`. NOT equivalent: the mixin form
    # formats as "Foo.X" while StrEnum formats as "x", so taking this rewrites
    # every log line and payload that interpolates one of these members. A
    # deliberate migration, not a lint autofix.
    "UP042",
    # PEP 695 `def f[T](...)` generics. Cosmetic; the codebase is consistent on
    # explicit TypeVars and mixing the two styles would read worse.
    "UP047",
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can have unused imports and assertions
"**/tests/**" = ["F401", "F811", "ARG"]
# Init files often have unused imports for re-export
"**/__init__.py" = ["F401"]
# main.py needs early logging setup before other imports
"backend/app/main.py" = ["E402"]
# MQTT client has some unused variables for debugging
"backend/app/services/bambu_mqtt.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "docker: marks tests that run in Docker integration environment",
]
