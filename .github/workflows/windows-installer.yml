name: Windows Installer

# Build the Windows installer .exe.
#
# Triggers:
#   - Tag push matching v* (release builds, uploaded as a release asset)
#   - Manual dispatch (for testing the build pipeline)
#
# The installer is unsigned until SignPath OSS approval lands. Once it
# does, add the SignPath GitHub Action between the ISCC step and the
# upload step.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least-privilege per CodeQL actions/missing-workflow-permissions.
# contents: write is required by softprops/action-gh-release to attach
# the .exe to a tag release; the manual-dispatch path doesn't trigger
# that step and could run with read-only, but a single workflow-level
# block keeps the surface auditable in one place.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only runs build.py; the installer's own interpreter is the embeddable
      # zip that script downloads (PYTHON_VERSION in installers/windows/build.py).
      # Kept on the same 3.12 as everything else so the two never drift apart.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Inno Setup 6.x is pre-installed on windows-latest runners (under
      # C:\Program Files (x86)\Inno Setup 6\). No install step needed.

      - name: Stage installer artifacts
        working-directory: installers/windows
        run: python build.py
        shell: pwsh

      - name: Compile installer (ISCC)
        working-directory: installers/windows
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" bamdude.iss
        shell: pwsh

      # Every tag release gets an unversioned copy alongside the versioned
      # filename, so external surfaces (website, wiki, newsletters) can link to
      # one URL that survives version bumps:
      #
      #   https://github.com/kainpl/bamdude/releases/latest/download/bamdude-windows-x64-setup.exe
      #
      # GitHub's `latest` redirect skips prereleases, so that URL always resolves
      # to the newest full release. A beta still gets the alias asset attached —
      # harmless, and it keeps this step free of channel logic.
      - name: Create unversioned alias
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: installers/windows/build/output
        run: |
          $versioned = Get-ChildItem -Filter "bamdude-*-windows-x64-setup.exe" | Select-Object -First 1
          if (-not $versioned) { throw "no versioned installer .exe found" }
          Copy-Item $versioned.FullName "bamdude-windows-x64-setup.exe"
          Write-Host "alias: bamdude-windows-x64-setup.exe -> $($versioned.Name)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: bamdude-windows-installer
          path: installers/windows/build/output/*.exe
          if-no-files-found: error

      # Beta tags are vX.Y.ZbN, stable is vX.Y.Z. The attach step below CREATES
      # the GitHub release when it doesn't exist yet, and without an explicit
      # prerelease flag it creates a full one — which then displaces the current
      # stable as the repo's "Latest" release. Decide the flag from the tag.
      - name: Classify tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: tagkind
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: installers/windows/build/output/*.exe
          fail_on_unmatched_files: true
          # Only meaningful when this step creates the release; editing an
          # existing one keeps whatever flag it already has.
          prerelease: ${{ steps.tagkind.outputs.prerelease }}
