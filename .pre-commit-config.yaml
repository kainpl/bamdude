# Pre-commit hooks for BamDude
# Install with: pip install pre-commit && pre-commit install

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Formatter
      - id: ruff-format
        types_or: [python, pyi]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # OFL.txt — vendored licence text for the label fonts. It must stay
      # byte-identical to upstream so a re-sync can be diffed against it;
      # normalising a trailing space would show as a diff forever. Same
      # reasoning as the calib_assets exclusion below.
      - id: trailing-whitespace
        exclude: ^(static/|backend/app/data/fonts/OFL\.txt$)
      - id: end-of-file-fixer
        exclude: ^(static/|backend/app/data/fonts/OFL\.txt$)
      - id: check-yaml
        # ``--unsafe`` allows custom YAML tags through. Kept on so any
        # future YAML using non-standard tags doesn't fail this hook.
        args: ['--unsafe']
      - id: check-json
        exclude: ^(static/|frontend/tsconfig\.)
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # static/assets — vite bundle; calib_assets — BS-mirrored 3MF/STL/STEP
        # geometry for the Filament Calibration wizard (AGPL-3.0, see
        # backend/app/data/calib_assets/LICENSE.md).
        exclude: ^(static/assets/|backend/app/data/calib_assets/)
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # Check for import shadowing (custom)
  - repo: local
    hooks:
      - id: check-import-shadowing
        name: Check for dangerous import shadowing
        entry: python -m pytest backend/tests/unit/test_code_quality.py::TestImportShadowing -v --tb=short
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/app/
      - id: frontend-typecheck
        name: TypeScript type check
        # `tsc -b`, NOT `tsc --noEmit`: the root tsconfig is `{"files": [],
        # "references": [...]}`, so a plain --noEmit run has nothing in its
        # program and exits 0 without checking a single file. -b walks the
        # referenced projects.
        #
        # Named project, not the root: the root now also references
        # `tsconfig.test.json`, and type-checking the test suite on every commit
        # roughly doubles the hook. The app is what ships, so the hook checks the
        # app (~43 s); `npm run typecheck` — `tsc -b --noEmit` over all three
        # projects, tests included — is what CI runs and what a release verifies.
        entry: bash -c 'cd frontend && npx tsc -b tsconfig.app.json --noEmit'
        language: system
        pass_filenames: false
        files: ^frontend/src/
        types_or: [ts, tsx]
