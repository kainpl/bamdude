name: Docker Publish :dev (manual)

# Publishes `:dev` from whatever the dev branch currently holds. MANUAL ONLY.
#
# ⚠️ **It used to fire on every push to dev, and that was the hole.** Nothing
# connected it to CI — different workflow, so `needs:` cannot reach across —
# and the two ran in parallel. Measured on 2026-08-18: commit 32d42cff had a
# RED CI run and its `:dev` image published anyway. The one tag aimed at
# testers was the one tag no gate ever looked at.
#
# It was also pure waste at exactly the wrong moment. A release pushes its
# commit to dev, which triggered a multi-arch QEMU build of an image nobody
# wants — half an hour later the identical content ships as :X.Y.Z, and at
# that moment dev == main anyway.
#
# `:dev` now moves when a **pre-release tag** is pushed (docker-publish-tag.yml
# publishes :X.Y.ZbN + :dev), so it means "the latest beta" — tested, gated,
# worth pinning — instead of "whatever was committed last". Every dev push is
# still proved to build: ci.yml's Docker Build job builds the production image,
# starts it and checks /health, the API and the static bundle. It just does not
# publish it, which is the point.
#
# This button remains for the case the tag flow cannot serve: an image from the
# current dev HEAD, on purpose, by a human.
#
# See temp/release_guide.md section 3.

on:
  workflow_dispatch:
    # Manual button in the Actions UI.

# Cancel an in-progress :dev build if a newer push arrives — old build's
# output would get overwritten anyway, saves buildx worker time.
concurrency:
  group: docker-publish-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write  # Required to push to ghcr.io

jobs:
  publish:
    name: Build & push :dev
    runs-on: ubuntu-latest
    # Skip for forks — secrets won't be available anyway, and a fork push
    # shouldn't clobber kainpl/bamdude:dev.
    if: github.repository == 'kainpl/bamdude'
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # --provenance / --sbom off to match the local docker-publish.sh
          # output shape — keeps :dev and `bash docker-publish.sh` images
          # byte-identical at the manifest level for bleeding-edge testers
          # reproducing bugs.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/kainpl/bamdude:dev
            kainpl/bamdude:dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Summary
        run: |
          echo "### :dev rolling image refreshed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/kainpl/bamdude:dev\` → $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`kainpl/bamdude:dev\` → $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull: \`docker pull ghcr.io/kainpl/bamdude:dev\`" >> "$GITHUB_STEP_SUMMARY"
