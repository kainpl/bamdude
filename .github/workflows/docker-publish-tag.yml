name: Docker Publish (tag)

# Publishes a multi-arch Docker image whenever a v* tag is pushed.
# Tag shape determines the channel and whether :latest moves:
#
#   v0.5.0     → stable → :0.5.0 + :latest
#   v0.5.0.1   → stable → :0.5.0.1 + :latest
#   v0.5.0b1   → beta   → :0.5.0b1               (no :latest)
#
# Anything else fails the classification step so the operator notices
# rather than getting a mis-channeled image.
#
# See temp/release_guide.md for the full release cadence and channel
# convention.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  actions: read  # the gate below reads CI run conclusions for this commit

jobs:
  # ============================================================================
  # Gate — refuse to publish a commit whose CI is not green
  # ============================================================================
  # Publishing used to be unconditional: this workflow fires on the tag push and
  # had no idea whether CI had ever run, let alone passed. That is how 0.5.1.3
  # came to exist — 0.5.1.2's CI was RED (a migration made every fresh install
  # fail to boot), the tag went up anyway, and the registry served a :latest that
  # no new user could start.
  #
  # The rule is "no run for this SHA failed", NOT "some run for this SHA
  # succeeded". That distinction is the whole point. ci.yml opens with
  # skip-duplicate-actions, so a fast-forward dev -> main produces a SECOND run
  # on the same SHA that skips every job and concludes `success` in ~10s. A gate
  # asking "did CI succeed here?" would find that empty run and wave the release
  # through — reproducing the exact bug it exists to prevent. 0.5.1.2 had both:
  # dev = failure, main = success-by-skipping.
  #
  # Runs still in flight also block: a tag pushed before CI finishes is a tag
  # nobody has tested yet.
  gate:
    name: Require green CI
    runs-on: ubuntu-latest
    if: github.repository == 'kainpl/bamdude'
    steps:
      - name: CI must be green for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          runs=$(gh api --paginate \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
            --jq '.workflow_runs[] | "\(.status)\t\(.conclusion // "-")\t\(.head_branch)\t\(.html_url)"')

          if [ -z "$runs" ]; then
            echo "::error::No CI run found for ${SHA}. Push the commit and let CI finish before tagging."
            exit 1
          fi

          echo "CI runs for ${SHA}:"
          printf '%s\n' "$runs" | sed 's/^/  /'

          # Anything unfinished means the tag outran its own tests.
          if printf '%s\n' "$runs" | grep -qvP '^completed\t'; then
            echo "::error::A CI run for ${SHA} has not finished. Wait for it, then re-run this workflow."
            exit 1
          fi

          # A single failure anywhere for this commit is disqualifying, however
          # many duplicate-skipped runs concluded success alongside it.
          if failed=$(printf '%s\n' "$runs" | grep -P '^completed\t(failure|timed_out|startup_failure)\t'); then
            echo "::error::CI failed for ${SHA} — refusing to publish."
            printf '%s\n' "$failed" | sed 's/^/  FAILED: /'
            exit 1
          fi

          if ! printf '%s\n' "$runs" | grep -qP '^completed\tsuccess\t'; then
            echo "::error::No successful CI run for ${SHA} (cancelled or skipped only)."
            exit 1
          fi

          echo "CI is green for ${SHA}."

  publish:
    name: Build & push tagged image
    runs-on: ubuntu-latest
    needs: gate
    if: github.repository == 'kainpl/bamdude'
    steps:
      - uses: actions/checkout@v7

      - name: Classify tag
        id: classify
        run: |
          # Strip the leading 'v' — the *_VERSION strings in config.py /
          # package.json / pyproject.toml never carry it.
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ b[0-9]+$ ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "tag_latest=false" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "tag_latest=true" >> "$GITHUB_OUTPUT"
          else
            # Unknown shape — don't guess, fail visibly so the operator can
            # correct the tag rather than end up with a mis-channeled image.
            echo "::error::Unrecognised tag shape: ${TAG}"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (stable)
        if: steps.classify.outputs.tag_latest == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/kainpl/bamdude:${{ steps.classify.outputs.version }}
            ghcr.io/kainpl/bamdude:latest
            kainpl/bamdude:${{ steps.classify.outputs.version }}
            kainpl/bamdude:latest
          cache-from: type=gha,scope=tag
          cache-to: type=gha,mode=max,scope=tag

      - name: Build and push (beta)
        if: steps.classify.outputs.tag_latest == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/kainpl/bamdude:${{ steps.classify.outputs.version }}
            kainpl/bamdude:${{ steps.classify.outputs.version }}
          cache-from: type=gha,scope=tag
          cache-to: type=gha,mode=max,scope=tag

      - name: Summary
        run: |
          echo "### Published ${GITHUB_REF_NAME} (${{ steps.classify.outputs.channel }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/kainpl/bamdude:${{ steps.classify.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- kainpl/bamdude:${{ steps.classify.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.classify.outputs.tag_latest }}" = "true" ]; then
            echo "- :latest updated" >> "$GITHUB_STEP_SUMMARY"
          fi
