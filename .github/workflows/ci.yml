name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    # Run on PRs targeting main or dev, but skip for repo owner (runs local tests)
  workflow_dispatch:
    # Manual-trigger button in the Actions UI — useful for re-running on a
    # branch that hasn't hit main yet (e.g. to validate feature work against
    # CI before merging).

# Skip CI for PRs authored by repo owner (they run tests locally)
# Uses PR author instead of triggering actor so rebasing by owner doesn't skip CI

env:
  # The one runtime, used by every job: Dockerfile is python:3.12-slim-trixie,
  # Ubuntu 24.04 LTS — the most common self-host base for a bare-metal install —
  # is also 3.12, and `requires-python` floors there. Keep those four in step.
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions for all jobs
permissions:
  contents: read
  actions: write  # needed by skip-duplicate-actions to cancel sibling runs

jobs:
  # ============================================================================
  # Skip duplicate runs — same SHA already built / in-flight on another ref
  # ============================================================================
  # Without this, a fast-forward dev → main merge triggers CI twice on the
  # same SHA (once per ref). skip-duplicate-actions detects the duplicate
  # by content hash and makes every downstream job short-circuit. The
  # concurrency block above still handles the single-ref case (new push to
  # the same branch cancels the in-flight run).
  check-duplicate:
    name: Check Duplicate
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
    steps:
      - id: skip
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          paths_ignore: '["**/*.md", "CHANGELOG.md"]'

  # ============================================================================
  # Backend Checks
  # ============================================================================

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    needs: check-duplicate
    if: needs.check-duplicate.outputs.should_skip != 'true' && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        # Install the exact pin from requirements-dev.txt rather than the latest
        # release, so CI and contributors run the same linter. `pip install ruff`
        # silently drifted ahead of every local venv — and a newer ruff's
        # `format --check` can fail a tree the pinned one formatted cleanly.
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Run ruff check
        run: ruff check backend/

      - name: Run ruff format check
        run: ruff format --check backend/

  backend-security:
    name: Backend Security
    runs-on: ubuntu-latest
    needs: check-duplicate
    if: needs.check-duplicate.outputs.should_skip != 'true' && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          # Upgrade setuptools too: the runner's Python toolcache ships an old
          # setuptools that trips pip-audit (PYSEC-2026-3447, fixed in 83.0.0).
          # A fix exists, so we upgrade rather than --ignore-vuln.
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        run: |
          # CVE-2026-4539: low-severity ReDoS in Pygments AdlLexer (indirect dep via pytest/rich).
          # No fix available yet. Remove --ignore-vuln once Pygments releases a patched version.
          # CVE-2026-3219: medium-severity (CVSS 4.6) in pip itself — pip treats a file that
          # identifies as BOTH tar and ZIP as a ZIP regardless of filename, so a crafted local
          # archive could install the "wrong" contents. Local attack vector only; BamDude
          # doesn't invoke pip at runtime (only at image build), so the blast radius is the
          # build environment. pip upstream hasn't cut a release with the fix yet — remove
          # --ignore-vuln once they do.
          # PYSEC-2025-183 (CVE-2025-45768): DISPUTED "weak encryption" in pyjwt — HS-* key
          # length is the app's responsibility (RFC 7518 §3.2), enforced in
          # core/auth.py:_get_jwt_secret (issue #10). No fix release planned; mirrors the
          # suppression already in security.yml so both audits agree.
          pip-audit --desc on --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2025-183

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    if: success() && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    steps:
      - uses: actions/checkout@v7
      # Single interpreter on purpose: 3.12 is the floor in pyproject.toml, what
      # the Dockerfile ships and what Ubuntu 24.04 LTS hands a bare-metal
      # install. A matrix here would test runtimes nobody runs us on. This was
      # briefly 3.12 + 3.11 because the mock FTPS server needed pyftpdlib, whose
      # `asyncore` left the stdlib in 3.12; that mock is stdlib-only now.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-py${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      # The 0.7.2 run on 2026-10-25 hit the former 35-minute ceiling with
      # 21507 passed, 675 skipped, no failures and 19 of 22201 tests remaining.
      # Tests kept completing until cancellation. Budget the whole growing
      # suite separately from the unchanged per-test --timeout=60 watchdog.
      # ⚠️ From the REPO ROOT, not `cd backend`. Some tests resolve paths
      # against the repository and one spawns `python -m
      # backend.app.worker_guardian`, which needs the root importable; run from
      # `backend/` they fail on the directory, not on the code. Tests ignore
      # the local `.env`; cameras always use the supervised worker.
      # See CONTRIBUTING.md#testing.
      - name: Run tests
        timeout-minutes: 60
        # ⚠️ `-n 4`, deliberately not `auto`. `auto` gave TWO workers here
        # (measured: only gw0 and gw1 in the log), while the same suite runs on
        # twelve locally. The interesting part is the ratio: six times fewer
        # workers cost only ~1.7x the wall time (17:41 against roughly 10:00),
        # which says this suite waits on I/O and fixture setup far more than it
        # computes. In that regime more processes than cores still win, because
        # the extra ones run while the others block. Baseline to compare against:
        # 1061s at `-n auto` on 2026-09-17.
        run: python -m pytest backend/tests/ -v --tb=short --timeout=60 --timeout-method=thread -n 4

  # The normal backend suite runs on Linux.  This deliberately small matrix
  # exercises the 3MF service/child boundary on every native installer
  # platform without multiplying the entire 14k-test suite threefold.
  print-analysis-process-smoke:
    name: Print Analysis Process Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: backend-lint
    if: success() && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Exercise child lifecycle
        run: >
          python -m pytest backend/tests/unit/services/test_analysis_runtime.py
          backend/tests/unit/services/test_analysis_codec.py
          backend/tests/unit/services/test_analysis_source.py
          backend/tests/unit/services/test_worker_staging.py
          -v --tb=short --timeout=180 --timeout-method=thread -n 1
      - name: Exercise local preview broker, service and renderer
        run: >
          python -m pytest backend/tests/unit/services/test_preview_runtime.py
          backend/tests/unit/services/test_preview_health.py
          backend/tests/unit/services/test_preview_protocol.py
          backend/tests/unit/services/test_preview_artifacts.py
          backend/tests/unit/test_service_shutdown_contract.py
          -v --tb=short --timeout=180 --timeout-method=thread -n 1
      - name: Exercise camera worker ownership and recovery
        run: >
          python -m pytest backend/tests/unit/services/test_camera_worker_supervisor.py
          backend/tests/unit/services/test_camera_runtime.py
          backend/tests/unit/services/test_camera_worker_capture.py
          backend/tests/unit/services/test_camera_worker_live.py
          backend/tests/unit/services/test_camera_worker_containment.py
          backend/tests/unit/services/test_worker_guardian.py
          backend/tests/unit/services/test_camera_worker_only_contract.py
          -v --tb=short --timeout=180 --timeout-method=thread -n 1

  part-render-smoke:
    needs: backend-lint
    if: success() && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    uses: ./.github/workflows/part-render-smoke.yml

  step-preview-smoke:
    needs: backend-lint
    if: success() && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    uses: ./.github/workflows/step-preview-smoke.yml

  postgres-scenarios:
    name: PostgreSQL Scenarios
    runs-on: ubuntu-latest
    needs: backend-lint
    if: success() && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    # This was the ONE job that enforced its result, back when Backend Tests and
    # both security scans were continue-on-error; that is no longer a distinction
    # — every job here now gates. A red result means PostgreSQL
    # installs are broken. A fresh install on PG was impossible from 0.4.2 until
    # 2026-07-27 precisely because nothing exercised it — every other PG test
    # mocks the engine and asserts on SQL text, which cannot catch a statement
    # the server refuses.
    #
    # Runs on every push rather than filtered by path. The breakage that started
    # it lived in a CHECK constraint on the OIDC model, nowhere near migrations —
    # a paths filter would not have fired.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bamdude
          POSTGRES_PASSWORD: bamdude
          POSTGRES_DB: bamdude_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-py${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run PostgreSQL scenarios
        # Includes nested transaction suites (the largest has a 15-minute
        # subprocess budget). Per-scenario watchdogs remain in force inside.
        timeout-minutes: 25
        env:
          TEST_POSTGRES_URL: postgresql://bamdude:bamdude@localhost:5432/bamdude_ci
        run: |
          cd backend
          python -m pytest tests/integration/test_postgres_scenarios.py -v --tb=short
      - name: Check database-health SQL isolation
        env:
          TEST_POSTGRES_URL: postgresql://bamdude:bamdude@localhost:5432/bamdude_ci
        run: python -m pytest backend/tests/integration/test_db_health_postgres.py -v --tb=short --timeout=60 --timeout-method=thread
      - name: Check PostgreSQL Compose statistics setup
        env:
          TEST_POSTGRES_COMPOSE: "1"
        run: python -m pytest backend/tests/integration/test_postgres_compose.py -v --tb=short --timeout=300 --timeout-method=thread

  # ============================================================================
  # Frontend Checks
  # ============================================================================

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    needs: check-duplicate
    if: needs.check-duplicate.outputs.should_skip != 'true' && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check i18n parity (en/uk)
        working-directory: frontend
        run: npm run i18n:check

  frontend-security:
    name: Frontend Security
    runs-on: ubuntu-latest
    needs: check-duplicate
    if: needs.check-duplicate.outputs.should_skip != 'true' && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: |
          # Only audit production dependencies and filter out npm-internal packages.
          # npm 10.x audit/ls reports vulns in its own bundled deps (npm, tar, minimatch)
          # so we parse package-lock.json directly to get the real prod dep list.
          #
          # Accepted findings live in .github/audit-exceptions.json, keyed by GHSA id.
          # Keyed by ADVISORY, never by package name: a different future hole in the
          # same package must still fail this gate.
          npm audit --omit=dev --json > /tmp/audit.json 2>/dev/null || true
          python3 ../.github/scripts/audit_gate.py /tmp/audit.json package-lock.json ../.github/audit-exceptions.json

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    needs: check-duplicate
    if: needs.check-duplicate.outputs.should_skip != 'true' && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript check
        working-directory: frontend
        # ⚠️ `npm run typecheck` (`tsc -b --noEmit`), never a bare `tsc --noEmit`:
        # the root tsconfig is `{"files": [], "references": [...]}`, so without
        # `-b` the compiler enters no file and exits 0 on anything at all. This
        # step was that no-op. The script walks all three projects, tests
        # included.
        run: npm run typecheck

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck]
    if: success() && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install local MCP connector test dependencies
        working-directory: integrations/mcp-adapter
        run: npm ci --ignore-scripts
      - name: Test local MCP connector
        working-directory: integrations/mcp-adapter
        run: npm test
      - name: Run tests
        # The full suite took 588s on the 0.7.2 runner; keep headroom above
        # that aggregate duration without changing Vitest's per-test limits.
        timeout-minutes: 15
        working-directory: frontend
        run: npm run test:run

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    if: success() && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # Docker Tests — does the IMAGE work, not "do the unit tests pass"
  # ============================================================================
  # No longer a mirror of test_docker.sh, which still runs everything locally.
  # The unit suites used to run a second time here, inside the test images. That
  # was ~10 minutes per run to re-learn what backend-tests and frontend-tests
  # had just proved on the runner — and while both of those were
  # continue-on-error, the duplicate was discarded as well. They gate now, so
  # the copy buys nothing. What only this job can prove is kept: the production
  # image builds, imports, ships static/, comes up healthy, and serves.

  docker-test:
    name: Docker Build
    runs-on: ubuntu-latest
    # postgres-scenarios joins the list: it was a hard gate that gated nothing
    # downstream, so a red PostgreSQL run still paid for a full image build.
    needs: [backend-tests, postgres-scenarios, frontend-build]
    if: success() && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    # The production build and full integration suite exceeded the old 20-minute cap.
    timeout-minutes: 60
    env:
      # The test image carries the committed STEP-preview pin whatever its status; a release
      # build (docker-publish-tag.yml) passes nothing, so a candidate pin fails it by itself.
      STEP_PREVIEW_CANDIDATE: "1"
    steps:
      - uses: actions/checkout@v7

      # Test 1: Docker Build
      - name: Build production image
        run: docker build --build-arg STEP_PREVIEW_CANDIDATE -t bamdude:test .

      - name: Verify backend imports
        run: docker run --rm bamdude:test python -c "import backend.app.main; print('Backend imports OK')"

      - name: Verify static files exist
        run: docker run --rm bamdude:test test -d /app/static

      - name: Render the fixtures inside the image
        run: docker run --rm bamdude:test python -m backend.app.part_render_probe render

      # The entrypoint drops to PUID 1000: both run as the app's user, read-only over the bundle, offline.
      - name: Verify the STEP-preview bundle inside the image
        run: docker run --rm --network none bamdude:test python -m backend.app.step_runtime verify

      - name: Render an STL and a STEP inside the image
        run: docker run --rm --network none bamdude:test python -m backend.app.step_render_probe

      # backend-tests already includes backend/tests/integration/. Its ASGI fixtures do not
      # talk to the production server, even when BAMDUDE_TEST_URL is set. Check the shipped
      # image through real HTTP instead, with a fresh database and no host ports or volumes.
      - name: Start the production HTTP server
        run: docker run -d --name bamdude-ci-http --network none bamdude:test

      - name: Exercise the production HTTP API and built assets
        timeout-minutes: 3
        run: docker exec -i bamdude-ci-http python - < scripts/docker_http_smoke.py

      - name: Show logs on failure
        if: failure()
        run: docker logs bamdude-ci-http

      - name: Cleanup
        if: always()
        run: docker rm -f -v bamdude-ci-http

  # The same image, built and checked natively on arm64 (owner, 2026-10-17): every release publishes both arches,
  # and before this a release tag was the first arm64 build the image ever had — the STEP bundle's arm64 wheels met
  # it on the way to users. Only what the image itself must prove runs here (the compose integration suite above is
  # not per-arch). Nothing is published: no login, no push, no secrets.
  docker-test-arm64:
    name: Docker Build (linux/arm64, native)
    runs-on: ubuntu-24.04-arm
    needs: [backend-tests, postgres-scenarios, frontend-build]
    if: success() && (github.event_name == 'push' || github.event.pull_request.user.login != github.repository_owner)
    timeout-minutes: 60
    env:
      STEP_PREVIEW_CANDIDATE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build --build-arg STEP_PREVIEW_CANDIDATE -t bamdude:test .

      - name: Verify the image is arm64
        run: test "$(docker image inspect bamdude:test --format '{{.Architecture}}')" = arm64

      - name: Verify backend imports
        run: docker run --rm bamdude:test python -c "import backend.app.main; print('Backend imports OK')"

      - name: Verify static files exist
        run: docker run --rm bamdude:test test -d /app/static

      - name: Render the fixtures inside the image
        run: docker run --rm bamdude:test python -m backend.app.part_render_probe render

      # The entrypoint drops to PUID 1000: both run as the app's user, read-only over the bundle, offline.
      - name: Verify the STEP-preview bundle inside the image
        run: docker run --rm --network none bamdude:test python -m backend.app.step_runtime verify

      - name: Render an STL and a STEP inside the image
        run: docker run --rm --network none bamdude:test python -m backend.app.step_render_probe
